<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">轨迹，铁路出行规划</title>
  <desc id="desc">深蓝色封面，右侧以出发、途径、换乘、到达四个节点绘制铁路路线。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101c38"/>
      <stop offset="0.6" stop-color="#142849"/>
      <stop offset="1" stop-color="#0b1731"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#59d4e7"/>
      <stop offset="0.37" stop-color="#f2bc65"/>
      <stop offset="0.7" stop-color="#79d1aa"/>
      <stop offset="1" stop-color="#f28c92"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" rx="24" fill="url(#background)"/>
  <rect width="1200" height="340" rx="24" fill="url(#grid)"/>
  <circle cx="1035" cy="50" r="230" fill="#44b4c9" opacity=".055"/>
  <circle cx="1040" cy="315" r="220" fill="#79d1aa" opacity=".035"/>
  <path d="M0 308H1200" stroke="#ffffff" stroke-opacity=".10"/>

  <text x="72" y="69" fill="#70dbe8" font-size="16" font-weight="700" letter-spacing="4" font-family="Arial, sans-serif">RAIL JOURNEY PLANNER</text>
  <text x="69" y="171" fill="#ffffff" font-size="82" font-weight="800" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">轨迹</text>
  <text x="73" y="220" fill="#c7d8eb" font-size="25" font-weight="500" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">把每一段铁路旅程，规划得更清楚。</text>

  <g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600">
    <rect x="72" y="257" width="151" height="34" rx="17" fill="#183c55" stroke="#4b91a5" stroke-opacity=".5"/>
    <text x="92" y="280" fill="#bcebf0">Android 7.0+</text>
    <rect x="237" y="257" width="100" height="34" rx="17" fill="#183c55" stroke="#4b91a5" stroke-opacity=".5"/>
    <text x="264" y="280" fill="#bcebf0">ARM64</text>
    <rect x="351" y="257" width="112" height="34" rx="17" fill="#183c55" stroke="#4b91a5" stroke-opacity=".5"/>
    <text x="377" y="280" fill="#bcebf0">离线规划</text>
  </g>

  <g fill="none" stroke="#c5def0" stroke-opacity=".12">
    <path d="M696 58H1112V282H696Z" stroke-dasharray="5 9"/>
    <path d="M730 92H1078M730 248H1078" stroke-dasharray="2 10"/>
  </g>
  <path d="M732 187C789 187 787 113 853 124S932 232 988 213 1036 151 1092 152" fill="none" stroke="#33506b" stroke-width="22" stroke-linecap="round"/>
  <path d="M732 187C789 187 787 113 853 124S932 232 988 213 1036 151 1092 152" fill="none" stroke="url(#track)" stroke-width="6" stroke-linecap="round"/>

  <g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">
    <circle cx="732" cy="187" r="19" fill="#152b48" stroke="#59d4e7" stroke-width="4"/>
    <circle cx="732" cy="187" r="6" fill="#59d4e7"/>
    <text x="732" y="234" fill="#cce5ed" font-size="17" font-weight="600">出发 A</text>

    <circle cx="853" cy="124" r="19" fill="#152b48" stroke="#f2bc65" stroke-width="4"/>
    <circle cx="853" cy="124" r="6" fill="#f2bc65"/>
    <text x="853" y="89" fill="#f6dab0" font-size="17" font-weight="600">途径 P</text>

    <circle cx="988" cy="213" r="19" fill="#152b48" stroke="#79d1aa" stroke-width="4"/>
    <circle cx="988" cy="213" r="6" fill="#79d1aa"/>
    <text x="988" y="262" fill="#cce9dc" font-size="17" font-weight="600">换乘 T</text>

    <circle cx="1092" cy="152" r="19" fill="#152b48" stroke="#f28c92" stroke-width="4"/>
    <circle cx="1092" cy="152" r="6" fill="#f28c92"/>
    <text x="1092" y="113" fill="#f6cccf" font-size="17" font-weight="600">到达 B</text>
  </g>
</svg>
